<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-body-font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --bs-body-color: #17212b;
            --bs-body-bg: #f4f7f6;
            --bs-primary: #059669;
            --bs-primary-rgb: 5, 150, 105;
            --bs-secondary: #64748b;
            --bs-secondary-rgb: 100, 116, 139;
            --bs-success: #059669;
            --bs-success-rgb: 5, 150, 105;
            --bs-info: #0f766e;
            --bs-info-rgb: 15, 118, 110;
            --bs-border-color: #e2e8f0;
            --bs-border-radius: .75rem;
            --bs-border-radius-lg: 1rem;
            --bs-border-radius-xl: 1.25rem;
        }

        body {
            min-height: 100vh;
            background: #f4f7f6;
            color: #17212b;
            font-size: .9375rem;
            line-height: 1.65;
            letter-spacing: .005em;
        }

        h1, h2, h3, h4, h5, h6 {
            color: #17212b;
            font-weight: 650;
            letter-spacing: -.025em;
        }

        .rounded-4 { border-radius: 1.25rem !important; }

        .login-container {
            max-width: 28rem;
            margin: 8rem auto;
            padding: 2.75rem;
            background: #fff;
            border-radius: 1.25rem;
            box-shadow: 0 18px 45px rgba(15, 23, 42, .08);
        }
        .dashboard-container {
            padding: 3rem 1.5rem 4rem;
            max-width: 1280px;
            margin: 0 auto;
        }
        .welcome-header {
            background: #17212b;
            color: white;
            padding: 2.5rem;
            border-radius: 1.25rem;
            margin-bottom: 2.25rem;
            box-shadow: 0 18px 42px rgba(23, 33, 43, .16);
        }
        .welcome-header h2 {
            color: #fff;
            margin-bottom: .25rem;
        }
        .welcome-header p {
            margin: 0;
            color: #cbd5e1;
        }

        .btn {
            --bs-btn-border-radius: .75rem;
            padding: .65rem 1.1rem;
            font-weight: 600;
            letter-spacing: .01em;
            border: 0;
            transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary, .btn-success {
            --bs-btn-bg: #059669;
            --bs-btn-hover-bg: #047857;
            --bs-btn-active-bg: #047857;
            --bs-btn-disabled-bg: #059669;
            box-shadow: 0 8px 16px rgba(5, 150, 105, .18);
        }
        .btn-secondary, .btn-info, .btn-dark {
            --bs-btn-bg: #334155;
            --bs-btn-color: #fff;
            --bs-btn-hover-bg: #1e293b;
            --bs-btn-hover-color: #fff;
            --bs-btn-active-bg: #1e293b;
            --bs-btn-active-color: #fff;
            --bs-btn-disabled-bg: #334155;
            --bs-btn-disabled-color: #fff;
        }
        .btn-light {
            --bs-btn-bg: rgba(255, 255, 255, .12);
            --bs-btn-hover-bg: rgba(255, 255, 255, .2);
            --bs-btn-color: #fff;
            --bs-btn-hover-color: #fff;
            --bs-btn-active-color: #fff;
            --bs-btn-active-bg: rgba(255, 255, 255, .25);
        }

        .form-control, .form-select {
            min-height: 2.8rem;
            padding: .65rem .85rem;
            color: #17212b;
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: .75rem;
            box-shadow: none;
        }
        .form-control:focus, .form-select:focus {
            border-color: #34d399;
            box-shadow: 0 0 0 .22rem rgba(5, 150, 105, .12);
        }
        .form-label { color: #475569; font-size: .8125rem; font-weight: 650; }

        .card, .modal-content {
            overflow: hidden;
            background: #fff;
            border: 0;
            border-radius: 1.25rem;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
        }
        .card-body { padding: 1.75rem; }
        .card-footer, .modal-header {
            padding: 1.1rem 1.75rem;
            background: transparent;
            border-color: #eef2f6;
        }
        .modal-body { padding: 1.75rem; }

        .nav-tabs {
            gap: .4rem;
            margin-bottom: 2rem !important;
            border: 0;
        }
        .nav-tabs .nav-link {
            color: #64748b;
            border: 0;
            border-radius: .7rem;
            padding: .65rem 1rem;
            font-weight: 600;
        }
        .nav-tabs .nav-link:hover { color: #17212b; background: #eaf0ee; }
        .nav-tabs .nav-link.active { color: #fff; background: #059669; box-shadow: 0 6px 14px rgba(5, 150, 105, .16); }

        .table-responsive {
            overflow: hidden;
            background: #fff;
            border-radius: 1.25rem;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
        }
        .table { margin-bottom: 0; --bs-table-striped-bg: #f8fafc; --bs-table-hover-bg: #f1f5f9; }
        .table > :not(caption) > * > * { padding: 1rem 1.25rem; border-bottom-color: #eef2f6; vertical-align: middle; }
        .table thead th { color: #64748b; background: #fbfcfc; font-size: .75rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }

        .badge { padding: .42rem .65rem; border-radius: .55rem; font-weight: 650; letter-spacing: .01em; }
        .bg-primary, .bg-success { background-color: #059669 !important; }
        .bg-secondary { background-color: #64748b !important; }
        .bg-info { background-color: #0f766e !important; }
        .bg-dark { background-color: #334155 !important; }
        .alert { padding: 1rem 1.25rem; border: 0; border-radius: .9rem; }
        .alert-info { color: #155e75; background: #ecfeff; }
        .alert-success { color: #065f46; background: #ecfdf5; }
        .alert-danger { color: #991b1b; background: #fef2f2; }
        .modal {
            background-color: rgba(15, 23, 42, .45);
            backdrop-filter: blur(5px);
        }
        .modal-dialog {
            margin-top: 5rem;
        }
        @media (max-width: 576px) {
            .login-container { margin: 2rem 1rem; padding: 2rem; }
            .dashboard-container { padding: 1.25rem 1rem 2rem; }
            .welcome-header { padding: 1.75rem; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./components/login-register.js"></script>
    <script src="./components/admin-dashboard.js"></script>
    <script src="./components/company-dashboard.js"></script>
    <script src="./components/student-dashboard.js"></script>
    <script src="./app.js"></script>
</body>
</html>
